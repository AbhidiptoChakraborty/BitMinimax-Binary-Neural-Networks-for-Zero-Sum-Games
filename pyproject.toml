[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitminimax"
version = "0.1.0"
description = "Binary Transformer solvers for zero-sum matrix games"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "tqdm>=4.66", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.ruff]
line-length = 120
target-version = "py310"
